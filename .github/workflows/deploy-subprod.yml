name: Deploy Subprod

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: deploy-subprod-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: UI unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run UI tests with coverage
        run: npm run coverage

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: subprod-ui-coverage-${{ github.event.pull_request.number }}
          path: coverage/
          if-no-files-found: error
          retention-days: 14

  deploy:
    name: Deploy subprod
    needs: test
    runs-on: ubuntu-latest
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run UI tests with coverage
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
        run: |
          set -o pipefail
          # Run tests with coverage, stream output to a log file so we can upload it even when tests fail.
          # The exit code of the test command will be preserved by set -o pipefail.
          mkdir -p coverage
          npm run coverage 2>&1 | tee coverage/test-output.txt

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: subprod-ui-coverage-${{ github.event.pull_request.number }}
          path: coverage/
          if-no-files-found: ignore
          retention-days: 14

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Pull Vercel Environment Information
        run: vercel pull --yes --environment=preview --token=${{ secrets.VERCEL_TOKEN }} --debug

      - name: Build Project Artifacts
        run: vercel build --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy Project Artifacts to Vercel
        id: deploy
        run: |
          url=$(vercel deploy --prebuilt --token=${{ secrets.VERCEL_TOKEN }})
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: Alias Deployment to jamspot-three.vercel.app
        run: vercel alias set "${{ steps.deploy.outputs.url }}" jamspot-three.vercel.app --token=${{ secrets.VERCEL_TOKEN }}
