name: Deploy Prod Preview

on:
  pull_request:
    branches:
      - prod
    paths:
      - apps/web/**
      - package.json
      - package-lock.json
      - .github/workflows/deploy-prod-preview.yml

permissions:
  contents: read

concurrency:
  group: deploy-prod-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: UI unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run UI tests with coverage
        working-directory: apps/web
        run: npm run coverage

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: prod-ui-coverage-${{ github.event.pull_request.number }}
          path: apps/web/coverage/
          if-no-files-found: error
          retention-days: 14

  deploy:
    name: Deploy prod preview
    needs: test
    runs-on: ubuntu-latest
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID_K7PZ }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Pull Vercel Environment Information
        run: vercel pull --yes --environment=preview --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build Project Artifacts
        run: vercel build --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy Project Artifacts to Vercel
        id: deploy
        run: |
          url=$(vercel deploy --prebuilt --token=${{ secrets.VERCEL_TOKEN }})
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: Alias Deployment to jamspot-k7pz.vercel.app
        run: vercel alias set "${{ steps.deploy.outputs.url }}" jamspot-k7pz.vercel.app --token=${{ secrets.VERCEL_TOKEN }}
